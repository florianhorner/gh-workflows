name: verify-claims-caller

# Exercise the reusable workflow from this PR by local path.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

jobs:
  verify:
    # Called workflows cannot elevate permissions. contents: read covers
    # checkout and rendering; actions: read covers ref resolution and run proofs.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-claims.yml
    with:
      owned_repos: "florianhorner/gh-workflows"
