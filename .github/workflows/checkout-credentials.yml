name: checkout-credentials

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit checkout credential persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Audit checkout credentials
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/zizmor-checkout-credentials.json"

          # zizmor 1.28 has no per-rule CLI filter. Keep its parser and
          # artipacked semantics, then fail only on that rule so this focused
          # policy does not unexpectedly gate consumers on unrelated audits.
          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --collect=workflows,actions \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json-v1 \
            . > "${report}"

          count="$(jq '[.[] | select(.ident == "artipacked" and .ignored == false)] | length' "${report}")"

          jq -r '
            .[]
            | select(.ident == "artipacked" and .ignored == false)
            | .locations[]
            | [
                (.symbolic.key.Local.verbatim_path // "workflow"),
                (((.concrete.location.start_point.row // 0) + 1) | tostring),
                (.symbolic.annotation // "checkout persists credentials")
              ]
            | @tsv
          ' "${report}" | while IFS=$'\t' read -r path line message; do
            path="${path#./}"
            echo "::error file=${path},line=${line},title=checkout credentials::${message}. Set persist-credentials: false unless a later git operation explicitly requires the token."
          done

          if [ "${count}" -ne 0 ]; then
            echo "Found ${count} checkout credential persistence finding(s)."
            exit 1
          fi

          echo "No checkout credential persistence findings."
