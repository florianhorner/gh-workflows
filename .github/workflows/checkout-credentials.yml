name: checkout-credentials

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: Pull request whose changed workflow files should be audited
        required: false
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Audit checkout credential persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        if: inputs.pull_request_number == 0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Prepare audit target
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PULL_REQUEST_NUMBER}" -eq 0 ]; then
            echo "AUDIT_TARGET=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
            echo "AUDIT_TARGET_EMPTY=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          audit_root="${RUNNER_TEMP}/checkout-credential-audit"
          manifest="${RUNNER_TEMP}/checkout-credential-files"
          mkdir -p "${audit_root}"

          # pull_request_target loads this caller from the trusted base branch.
          # Read only the proposed YAML through GitHub's API; never check out or
          # execute pull-request-controlled code in the privileged event.
          expected_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" \
            --jq '.changed_files')"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files?per_page=100" \
            --jq '
              .[]
              | [.status, .filename, .contents_url]
              | @base64
            ' > "${manifest}"

          actual_count="$(wc -l < "${manifest}" | tr -d ' ')"
          if [ "${actual_count}" -ne "${expected_count}" ]; then
            echo "GitHub returned ${actual_count} of ${expected_count} changed files; refusing a partial audit." >&2
            exit 1
          fi

          count=0
          while IFS= read -r encoded; do
            [ -n "${encoded}" ] || continue
            record="$(printf '%s' "${encoded}" | base64 --decode)"
            status="$(jq -r '.[0]' <<< "${record}")"
            filename="$(jq -r '.[1]' <<< "${record}")"
            contents_url="$(jq -r '.[2]' <<< "${record}")"

            if [ "${status}" = "removed" ]; then
              continue
            fi
            if [[ ! "${filename}" =~ ^\.github/workflows/.*\.ya?ml$ \
              && ! "${filename}" =~ ^\.github/actions/(.*/)?action\.ya?ml$ ]]; then
              continue
            fi

            if [[ "${filename}" == *$'\n'* || "${filename}" == *$'\r'* || "${filename}" == *$'\t'* \
              || "${filename}" =~ (^|/)\.\.?(/|$) ]]; then
              echo "Unsafe workflow path returned by GitHub: ${filename}" >&2
              exit 1
            fi

            destination="${audit_root}/${filename}"
            mkdir -p "$(dirname "${destination}")"
            gh api "${contents_url}" \
              --jq 'if .type == "file" and .encoding == "base64" then .content else error("expected base64 file content") end' \
              | tr -d '\n' \
              | base64 --decode > "${destination}"
            count=$((count + 1))
          done < "${manifest}"

          echo "AUDIT_TARGET=${audit_root}" >> "${GITHUB_ENV}"
          if [ "${count}" -eq 0 ]; then
            echo "AUDIT_TARGET_EMPTY=true" >> "${GITHUB_ENV}"
            echo "No retained workflow or composite-action YAML files to audit."
          else
            echo "AUDIT_TARGET_EMPTY=false" >> "${GITHUB_ENV}"
            echo "Collected ${count} changed workflow/action file(s) through the GitHub API."
          fi

      - name: Audit checkout credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ "${AUDIT_TARGET_EMPTY}" = "true" ]; then
            exit 0
          fi

          report="${RUNNER_TEMP}/zizmor-checkout-credentials.json"

          # zizmor 1.28 has no per-rule CLI filter. Keep its parser and
          # artipacked semantics, then fail only on that rule so this focused
          # policy does not unexpectedly gate consumers on unrelated audits.
          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --collect=workflows,actions \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json-v1 \
            "${AUDIT_TARGET}" > "${report}"

          count="$(jq '[.[] | select(.ident == "artipacked" and .ignored == false)] | length' "${report}")"

          jq -r '
            .[]
            | select(.ident == "artipacked" and .ignored == false)
            | .locations[]
            | [
                (.symbolic.key.Local.verbatim_path // "workflow"),
                (((.concrete.location.start_point.row // 0) + 1) | tostring),
                (.symbolic.annotation // "checkout persists credentials")
              ]
            | @tsv
          ' "${report}" | while IFS=$'\t' read -r path line message; do
            path="${path#./}"
            echo "::error file=${path},line=${line},title=checkout credentials::${message}. Set persist-credentials: false unless a later git operation explicitly requires the token."
          done

          if [ "${count}" -ne 0 ]; then
            echo "Found ${count} checkout credential persistence finding(s)."
            exit 1
          fi

          echo "No checkout credential persistence findings."
