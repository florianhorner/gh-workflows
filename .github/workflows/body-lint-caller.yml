name: body-lint-caller

# Dogfood: lints gh-workflows' own PR and issue bodies using the reusable
# workflow defined in this same repo, by local path. A change to body-lint.yml
# on a PR branch is therefore tested against itself — a bad change breaks its
# own verification, which is the point.
#
# Note this repo has no scripts/lint-patterns.sh of its own to pass as
# extra_patterns; the baseline alone applies here. Consuming repos that carry
# project-specific patterns pass their path instead. See README.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
  issues:
    types: [opened, edited]

jobs:
  # The pattern set is only as good as the harness that measures it, and a test
  # that nothing runs is not a gate. This job is also where GNU grep gets
  # exercised: the local hook resolves BSD grep, so without a Linux runner half
  # the dialect contract is untested.
  patterns:
    if: github.event_name == 'pull_request'
    name: Pattern harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run pattern regression test
        run: bash tests/test-lint-patterns.sh

  pr-body:
    if: github.event_name == 'pull_request'
    # Required, not optional. A called workflow's permissions can only be
    # maintained or reduced relative to the caller, never elevated, and an
    # attempted elevation is refused before anything runs: startup_failure,
    # with no logs and no check run to inspect. body-lint.yml declares
    # `actions: read` to resolve its own ref, so callers need both lines.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/body-lint.yml
    with:
      target: pr-body

  issue-body:
    if: github.event_name == 'issues' && github.event.issue.user.login == 'florianhorner'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/body-lint.yml
    with:
      target: issue-body
