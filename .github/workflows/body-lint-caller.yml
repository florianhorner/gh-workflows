name: body-lint-caller

# Exercise this repository's reusable workflow by local path on each PR.
# Only baseline patterns apply; no extra_patterns file is configured.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
  issues:
    types: [opened, edited]

jobs:
  # Exercise the pattern harness with GNU grep as well as local BSD grep.
  patterns:
    if: github.event_name == 'pull_request'
    name: Pattern harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run pattern regression test
        run: bash tests/test-lint-patterns.sh

  pr-body:
    if: github.event_name == 'pull_request'
    # Called workflows cannot elevate permissions. Both are required for
    # checkouts and reusable-workflow ref resolution.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/body-lint.yml
    with:
      target: pr-body

  issue-body:
    if: github.event_name == 'issues' && github.event.issue.user.login == 'florianhorner'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/body-lint.yml
    with:
      target: issue-body
