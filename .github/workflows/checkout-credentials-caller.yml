name: checkout-credentials-caller

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit-pr:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/checkout-credentials.yml
    with:
      pull_request_number: ${{ github.event.pull_request.number }}

  audit-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/checkout-credentials.yml
