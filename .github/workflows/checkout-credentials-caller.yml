name: checkout-credentials-caller

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/test-checkout-credentials"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/test-checkout-credentials"

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/checkout-credentials.yml
