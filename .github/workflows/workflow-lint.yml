name: workflow-lint

# Added after florianhorner/gh-workflows#6 shipped a `Resolve own ref` step built
# on `github.job_workflow_ref` — a property that does not exist on the github
# context (it is an OIDC token claim). GitHub rejected the workflow with
# startup_failure: no logs, no annotation, no check run to inspect. actionlint
# names it in one line:
#
#   property "job_workflow_ref" is not defined in object type {… workflow_ref:
#   string; workflow_sha: string; …}
#
# Scope note, so this is not mistaken for full coverage: actionlint is static.
# It cannot see the *other* failure from that day — a called workflow requesting
# more permissions than its caller granted, which is a runtime relationship
# between two files and also produces a bare startup_failure. The dogfood caller
# in verify-claims-caller.yml is what catches that one. Both are needed.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Installed from the upstream release rather than a third-party action, so
      # the only new dependency is a version-pinned binary from rhysd/actionlint.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: Lint workflows
        run: ./actionlint

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Test checkout credential audit
        run: bash scripts/test-checkout-credentials

  # A test that nothing runs is not a gate — the same reason body-lint-caller.yml
  # carries its pattern harness. scripts/__tests__ was dev-machine-only until
  # this job existed: `scripts/package.json` defined `test`, and no workflow
  # invoked it, so a change to any .ts file triggered nothing. That is tolerable
  # for a parser that only ever refuses; it is not tolerable for
  # clean-integrate-witness.ts, which decides when verify-claims ACCEPTS a run
  # whose SHA does not match the PR head. A silent edit there widens the gate
  # for every consuming repo at once.
  scripts:
    name: Parser and witness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # The witness builds real repositories and asks real git, so the runner's
      # git has to be able to answer: `merge-tree --write-tree` needs >= 2.38.
      # Asserted rather than assumed, because the predicate reports an
      # unavailable merge-tree as a refusal, which on a green run would look
      # exactly like a correct verdict.
      - name: Assert git can answer the witness
        run: |
          set -euo pipefail
          git --version
          # Run it for real rather than probing --help: `--help` after a flag
          # exits 129 regardless of whether the flag is supported, so the probe
          # failed on a runner whose git was fine. Merging a commit with itself
          # is a pure object-database read that prints its tree.
          git merge-tree --write-tree --no-messages HEAD HEAD >/dev/null

      - name: Install dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: scripts
        run: bun test
