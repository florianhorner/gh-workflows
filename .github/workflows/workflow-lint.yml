name: workflow-lint

# Static workflow checks catch invalid context properties. The reusable
# workflow callers also exercise runtime permission relationships.

on:
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Install the version-pinned upstream binary.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: Lint workflows
        run: ./actionlint

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"

      - name: Test checkout credential audit
        run: bash scripts/test-checkout-credentials

      - name: Test pin check
        run: bash scripts/test-pin-check

  # Test parser rejection and merge-witness acceptance for consuming workflows.
  scripts:
    name: Parser and witness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # The witness needs git merge-tree --write-tree (Git >= 2.38). Verify
      # availability separately so an unavailable command cannot mask a test.
      - name: Assert git can answer the witness
        run: |
          set -euo pipefail
          git --version
          # A self-merge reads the object database. --help does not test support.
          git merge-tree --write-tree --no-messages HEAD HEAD >/dev/null

      - name: Install dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: scripts
        run: bun test
