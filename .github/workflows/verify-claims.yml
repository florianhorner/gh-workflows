name: verify-claims

on:
  workflow_call:
    inputs:
      owned_repos:
        description: "Comma-separated list of repos this owner owns (e.g. florianhorner/govee2mqtt,florianhorner/mammamiradio)"
        required: true
        type: string

concurrency:
  group: verify-claims-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Checkouts and private Markdown rendering need contents: read. Resolving
# referenced_workflows[] and CI-run proof URLs needs actions: read. Optional
# issue and pull-request read permissions for label rendering are not granted.
# Callers must permit at least this access for GitHub to start the job.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify PR proof block
    runs-on: ubuntu-latest
    # Bound the time spent rendering the body and looking up run artifacts.
    timeout-minutes: 10

    # Skip draft PRs
    if: |
      github.event.pull_request.draft == false &&
      !contains(fromJson('["dependabot[bot]","pre-commit-ci[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)

    steps:
      # Runs before the checkouts because it decides how much history to fetch.
      - name: Fetch PR body
        id: pr-body
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const fs = require("fs");
            fs.writeFileSync("/tmp/pr-body.md", body, "utf8");
            core.info(`PR body length: ${body.length} chars`);
            // Only CI-run proofs need full history for the merge witness.
            // A false positive costs a deep fetch; a false negative leaves the
            // shallow witness unable to prove integration, so it fails closed.
            // Include percent-encoded and doubled slashes recognised by the parser.
            const citesCiRun = /actions(?:\/|%2f)+runs(?:\/|%2f)+[^\s)\]]/i.test(body);
            core.info(`Cites a CI run URL: ${citesCiRun}`);
            core.setOutput("cites_ci_run", String(citesCiRun));

      # The merge witness needs the run commit, integrated parent and base
      # first-parent history. A shallow checkout cannot prove integration.
      # Quote '0': an unquoted numeric 0 is falsy, so && 0 || 1 yields 1.
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ steps.pr-body.outputs.cites_ci_run == 'true' && '0' || '1' }}
          persist-credentials: false

      # Check out scripts at the SHA the caller pinned. referenced_workflows[]
      # exposes that callee SHA; github.workflow_ref and workflow_sha describe
      # the caller. job_workflow_ref is an OIDC claim, not a context property.
      - name: Resolve own ref
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                   --jq '.referenced_workflows[]?
                         | select(.path | startswith("florianhorner/gh-workflows/.github/workflows/verify-claims.yml@"))
                         | .sha' 2>/dev/null | head -n1 || true)"
          if [ -z "$sha" ]; then
            # Local-path calls use the PR head, matching the first checkout.
            sha="$PR_HEAD_SHA"
            echo "No referenced_workflows entry — local invocation, using PR head ${sha}"
          fi
          if [ -z "$sha" ]; then
            echo "::error::could not resolve the ref this workflow was called with"
            exit 1
          fi
          echo "ref=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved own ref: ${sha}"

      - name: Checkout gh-workflows scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: florianhorner/gh-workflows
          ref: ${{ steps.self.outputs.ref }}
          path: _gh_workflows
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install parser dependencies
        working-directory: _gh_workflows/scripts
        run: bun install --frozen-lockfile

      - name: Validate proof block
        working-directory: _gh_workflows/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Anchor the integrated parent to the PR's base branch. Without this
          # ref the witness cannot establish a clean base integration.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          OWNED_REPOS: ${{ inputs.owned_repos }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: bun run verify-proof-block.ts --body-file /tmp/pr-body.md
