name: verify-claims

on:
  workflow_call:
    inputs:
      owned_repos:
        description: "Comma-separated list of repos this owner owns (e.g. florianhorner/govee2mqtt,florianhorner/mammamiradio)"
        required: true
        type: string

concurrency:
  group: verify-claims-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege. `contents: read` covers both checkouts; `actions: read` is
# required because verify-proof-block.ts resolves CI-run proof URLs against
# /repos/{owner}/{repo}/actions/runs/{id}. Callers can reduce this further but
# cannot elevate it.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify PR proof block
    runs-on: ubuntu-latest

    # Skip draft PRs
    if: |
      github.event.pull_request.draft == false &&
      !contains(fromJson('["dependabot[bot]","pre-commit-ci[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)

    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Resolve the ref this workflow was itself called with, so the scripts we
      # execute are the ones the caller pinned. Previously this checkout was
      # hardcoded to `v1`, which meant a consumer pinning @v1.1 — or even a full
      # commit SHA — still ran whatever verify-proof-block.ts happened to be at
      # the tip of v1. The outer pin locked this YAML and nothing else, so it
      # bought no reproducibility and no supply-chain protection.
      #
      # There is no `github` context property carrying the *callee* ref.
      # `github.workflow_ref`/`workflow_sha` resolve to the CALLER, and
      # `job_workflow_ref` is an OIDC token claim, not a context value — using it
      # in an expression fails the whole workflow at startup.
      #
      # The Actions API does expose it: a run's `referenced_workflows[]` lists
      # every remote reusable workflow it invoked, with the exact commit SHA that
      # was resolved. That is what `actions: read` above is for.
      - name: Resolve own ref
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                   --jq '.referenced_workflows[]?
                         | select(.path | startswith("florianhorner/gh-workflows/.github/workflows/verify-claims.yml@"))
                         | .sha' 2>/dev/null | head -n1 || true)"
          if [ -z "$sha" ]; then
            # No entry means this was invoked by local path (`uses: ./…`), i.e.
            # gh-workflows dogfooding itself. The correct scripts are the ones on
            # the PR head, which is also what the first checkout used.
            sha="$PR_HEAD_SHA"
            echo "No referenced_workflows entry — local invocation, using PR head ${sha}"
          fi
          if [ -z "$sha" ]; then
            echo "::error::could not resolve the ref this workflow was called with"
            exit 1
          fi
          echo "ref=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved own ref: ${sha}"

      - name: Checkout gh-workflows scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: florianhorner/gh-workflows
          ref: ${{ steps.self.outputs.ref }}
          path: _gh_workflows
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install parser dependencies
        working-directory: _gh_workflows/scripts
        run: bun install --frozen-lockfile

      - name: Fetch PR body
        id: pr-body
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const fs = require("fs");
            fs.writeFileSync("/tmp/pr-body.md", body, "utf8");
            core.info(`PR body length: ${body.length} chars`);

      - name: Validate proof block
        working-directory: _gh_workflows/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          OWNED_REPOS: ${{ inputs.owned_repos }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: bun run verify-proof-block.ts --body-file /tmp/pr-body.md
