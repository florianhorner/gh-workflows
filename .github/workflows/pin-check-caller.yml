name: pin-check-caller

# Dogfood: checks this repository's own pins with pin-check.yml, called by
# local path. pull_request_target loads the caller and the reusable workflow
# from the base branch, so a pull request cannot switch the check off for
# itself. Changes to pin-check.yml are exercised before merge by
# scripts/test-pin-check, which workflow-lint.yml runs on every pull request.

on:
  pull_request_target:
    # `edited` is what GitHub sends when a pull request's base branch changes;
    # without it, a check made against one base stays on a pull request that
    # now targets another.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/pin-check.yml
    with:
      pull_request_number: ${{ github.event.pull_request.number }}

  check-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/pin-check.yml
