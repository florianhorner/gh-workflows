name: body-lint

# Editorial lint for PR and issue bodies and public changelogs.

on:
  workflow_call:
    inputs:
      target:
        description: "What to lint: pr-body | issue-body | changelog"
        required: true
        type: string
      extra_patterns:
        description: >-
          Optional repo-local pattern file (e.g. scripts/lint-patterns.sh),
          resolved against the caller's BASE ref. Its LINT_PATTERNS array is
          unioned with the baseline. Repos may only ADD patterns.
        required: false
        default: ""
        type: string
      changelog_paths:
        description: "Space-separated changelog files, used when target=changelog."
        required: false
        default: "CHANGELOG.md"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  lint:
    name: Editorial body lint
    runs-on: ubuntu-latest

    # Lint public drafts; exempt the listed bot authors from PR-body lint.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJson('["dependabot[bot]","pre-commit-ci[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)

    steps:
      # Base ref, never head. A PR must not be able to weaken the gate that is
      # judging it in the same change.
      - name: Checkout caller base ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          path: _caller
          persist-credentials: false

      # Resolve the pinned callee SHA through referenced_workflows[]; the github
      # context exposes the caller ref. This lookup needs actions: read.
      - name: Resolve own ref
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                   --jq '.referenced_workflows[]?
                         | select(.path | startswith("florianhorner/gh-workflows/.github/workflows/body-lint.yml@"))
                         | .sha' 2>/dev/null | head -n1 || true)"
          if [ -z "$sha" ]; then
            # Local-path calls use this repository's triggering SHA.
            sha="${GITHUB_SHA}"
            echo "No referenced_workflows entry — local invocation, using ${sha}"
          fi
          echo "ref=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-workflows scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: florianhorner/gh-workflows
          ref: ${{ steps.self.outputs.ref }}
          path: _gh_workflows
          persist-credentials: false

      - name: Write body to disk
        id: body
        env:
          TARGET: ${{ inputs.target }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            pr-body)    printf '%s' "$PR_BODY"    > /tmp/body.md ;;
            issue-body) printf '%s' "$ISSUE_BODY" > /tmp/body.md ;;
            changelog)  : ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac

      - name: Lint
        env:
          TARGET: ${{ inputs.target }}
          EXTRA: ${{ inputs.extra_patterns }}
          CHANGELOGS: ${{ inputs.changelog_paths }}
        run: |
          set -uo pipefail
          LINT=_gh_workflows/scripts/check-body-lint.sh
          # An array avoids passing an empty scalar as a pattern-file argument.
          EXTRA_ARGS=()
          if [ -n "$EXTRA" ]; then
            if [ -r "_caller/$EXTRA" ]; then
              EXTRA_ARGS=("_caller/$EXTRA")
            else
              # A missing configured file must fail rather than omit rules.
              echo "::error::extra_patterns '$EXTRA' not found on the base ref"
              exit 1
            fi
          fi

          rc=0
          if [ "$TARGET" = "changelog" ]; then
            for f in $CHANGELOGS; do
              [ -r "_caller/$f" ] || { echo "::notice::skipping absent $f"; continue; }
              echo "--- $f"
              bash "$LINT" --mode changelog "_caller/$f" ${EXTRA_ARGS+"${EXTRA_ARGS[@]}"} || rc=$?
            done
          else
            if [ ! -s /tmp/body.md ]; then
              echo "::notice::empty body, nothing to lint"
              exit 0
            fi
            bash "$LINT" --mode body /tmp/body.md ${EXTRA_ARGS+"${EXTRA_ARGS[@]}"} || rc=$?
          fi

          # Preserve the distinct exit code for an unavailable lint check.
          if [ "$rc" -eq 2 ]; then
            echo "::error::editorial lint could not run (gate error)"
            exit 2
          fi
          exit "$rc"
